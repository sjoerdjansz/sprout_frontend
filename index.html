<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@300..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Sprout</title>
    <script>
      // Set the theme before the first paint so dark mode doesn't flash light.
      // Same rule as cachedPreference() in src/stores/theme.ts: light or dark from your settings,
      // otherwise (match system, or not loaded yet) your system.
      ;(function () {
        var theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        var savedTheme = localStorage.getItem('sprout.theme')
        if (savedTheme === 'light' || savedTheme === 'dark') {
          theme = savedTheme
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
